name: Deploy bilBackend to Server

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lint (optional but recommended)
        run: |
          source venv/bin/activate
          pip install flake8
          flake8 . || true

      - name: Run Tests
        run: |
          source venv/bin/activate
          python manage.py test

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            echo "🚀 Starting deployment..."

            # Project directory
            APP_DIR="/var/www/projects/bilBackend"

            mkdir -p $APP_DIR
            cd $APP_DIR

            # Clone or update repo
            if [ ! -d ".git" ]; then
              echo "📥 Cloning repository..."
              git clone https://github.com/Abram-MrRight/bilBackend.git .
            fi

            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Virtual environment
            if [ ! -d "venv" ]; then
              echo "📦 Creating virtual environment..."
              python3 -m venv venv
            fi

            source venv/bin/activate

            echo "📦 Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔄 Running migrations..."
            python manage.py migrate --noinput

            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput

            echo "🔄 Restarting Gunicorn..."
            if systemctl list-units --full -all | grep -q "gunicorn_bilBackend.service"; then
              sudo systemctl restart gunicorn_bilBackend
            else
              echo "⚠️ Gunicorn service not configured"
            fi

            echo "🔄 Restarting Nginx..."
            sudo systemctl restart nginx

            echo "✅ Deployment successful!"
          EOF